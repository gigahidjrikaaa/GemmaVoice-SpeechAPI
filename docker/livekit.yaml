# LiveKit Server Configuration
# Documentation: https://docs.livekit.io/realtime/self-hosting/deployment/

port: 7880
rtc:
  port_range_start: 50000
  port_range_end: 50100
  tcp_port: 7881
  # Note: do not set `udp_port` when `port_range_start/end` are set.
  # `udp_port` enables UDP mux and requires port_range_* to be unset.

  # For local Docker-on-desktop setups, advertising a public/stun-discovered IP can
  # cause ICE connectivity failures. Prefer local interface IPs and also include
  # loopback candidates so the browser can connect via published localhost ports.
  use_external_ip: false
  enable_loopback_candidate: true

  # Make the server more willing to fall back to TCP when UDP checks fail.
  allow_tcp_fallback: true

# API keys - override via LIVEKIT_KEYS environment variable
# Format: "api_key: secret"
keys:
  devkey: devsecretdevsecretdevsecretdevsecret

# Logging
logging:
  level: info
  json: false

# Room settings
room:
  auto_create: true
  empty_timeout: 300  # 5 minutes
  max_participants: 10



# Redis configuration (optional, for multi-node deployments)
# redis:
#   address: redis:6379
